<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ILLC - Interactive Language Learning Chatbot</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0/dist/transformers.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: #333;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 30px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .logo i {
            font-size: 2.5rem;
            color: #fff;
        }
        
        .logo h1 {
            color: white;
            font-size: 2rem;
            font-weight: 700;
        }
        
        .logo span {
            color: #ffd700;
        }
        
        .user-actions {
            color: white;
            font-weight: 500;
        }
        
        .content-area {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            min-height: 70vh;
            position: relative;
            overflow: hidden;
        }
        
        .floating-home-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 60px;
            height: 60px;
            background: #ff6b6b;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
            cursor: pointer;
            z-index: 1000;
            transition: all 0.3s ease;
        }
        
        .floating-home-btn:hover {
            transform: scale(1.1);
            background: #ff5252;
        }
        
        .floating-home-btn i {
            color: white;
            font-size: 1.5rem;
        }
        
        .floating-chat-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 70px;
            height: 70px;
            background: #4ecdc4;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(78, 205, 196, 0.4);
            cursor: pointer;
            z-index: 1000;
            transition: all 0.3s ease;
        }
        
        .floating-chat-btn:hover {
            transform: scale(1.1);
            background: #26a69a;
        }
        
        .floating-chat-btn i {
            color: white;
            font-size: 1.8rem;
        }
        
        .chatbot-container {
            position: fixed;
            bottom: 100px;
            right: 20px;
            width: 380px;
            height: 500px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            z-index: 999;
            display: none;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .chatbot-header {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .chatbot-header h3 {
            margin: 0;
            font-weight: 600;
        }
        
        .close-chat {
            background: none;
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
        }
        
        .chatbot-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.4;
        }
        
        .user-message {
            align-self: flex-end;
            background: #e3f2fd;
            border-bottom-right-radius: 5px;
        }
        
        .bot-message {
            align-self: flex-start;
            background: #f5f5f5;
            border-bottom-left-radius: 5px;
        }
        
        .chatbot-input {
            display: flex;
            padding: 15px;
            border-top: 1px solid #eee;
        }
        
        .chatbot-input input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 30px;
            outline: none;
            font-size: 1rem;
        }
        
        .chatbot-input button {
            background: #4ecdc4;
            border: none;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            margin-left: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .chatbot-input button:hover {
            background: #26a69a;
        }
        
        .loading {
            opacity: 0.7;
            font-style: italic;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: white;
            margin-top: 30px;
        }
        
        .welcome-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
            animation: fadeIn 1s ease;
            cursor: pointer;
        }
        
        .welcome-screen h2 {
            font-size: 3rem;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .welcome-screen p {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: #555;
        }
        
        .welcome-screen .university {
            font-weight: 600;
            color: #6a11cb;
        }
        
        .welcome-screen .developer {
            font-style: italic;
            margin-top: 20px;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 15px rgba(106, 17, 203, 0.3);
        }
        
        /* Home Page Styles */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .dashboard-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        
        .dashboard-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }
        
        .dashboard-card i {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #6a11cb;
        }
        
        .dashboard-card h3 {
            margin-bottom: 10px;
            color: #333;
        }
        
        .dashboard-card p {
            color: #666;
            font-size: 0.9rem;
        }
        
        /* Practice Page Styles */
        .practice-container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .filter-group {
            display: flex;
            flex-direction: column;
        }
        
        .filter-group label {
            margin-bottom: 5px;
            font-weight: 500;
            color: #555;
        }
        
        .filter-group select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }
        
        .practice-area {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            min-height: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .question {
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-align: center;
            color: #333;
        }
        
        .option-button {
            display: block;
            width: 100%;
            max-width: 400px;
            padding: 15px;
            margin: 10px 0;
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .option-button:hover {
            background: #e9ecef;
            border-color: #6a11cb;
        }
        
        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: 500;
            display: none;
        }
        
        .correct {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .incorrect {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        /* Learn Page Styles */
        .learn-container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .flashcard-container {
            perspective: 1000px;
            margin: 30px 0;
        }
        
        .flashcard {
            width: 100%;
            height: 300px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }
        
        .flashcard.flipped {
            transform: rotateY(180deg);
        }
        
        .flashcard-front, .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            background: white;
        }
        
        .flashcard-back {
            transform: rotateY(180deg);
            background: #f8f9fa;
        }
        
        .flashcard-word {
            font-size: 2.5rem;
            font-weight: bold;
            color: #6a11cb;
            margin-bottom: 10px;
        }
        
        .flashcard-pronunciation {
            font-size: 1.2rem;
            color: #666;
            font-style: italic;
            margin-bottom: 20px;
        }
        
        .flashcard-meaning {
            font-size: 1.5rem;
            color: #333;
            text-align: center;
        }
        
        .navigation-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        
        .progress-container {
            margin: 20px 0;
        }
        
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e9ecef;
            border-radius: 5px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            transition: width 0.3s ease;
        }
        
        .progress-text {
            text-align: center;
            margin-top: 10px;
            color: #666;
            font-weight: 500;
        }
        
        /* Placeholder Pages */
        .page-placeholder {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
            padding: 40px;
        }
        
        .page-placeholder i {
            font-size: 4rem;
            color: #6a11cb;
            margin-bottom: 20px;
        }
        
        .page-placeholder h2 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #333;
        }
        
        .page-placeholder p {
            font-size: 1.1rem;
            color: #666;
            max-width: 600px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="floating-home-btn" id="homeBtn">
        <i class="fas fa-home"></i>
    </div>
    
    <div class="floating-chat-btn" id="chatBtn">
        <i class="fas fa-comments"></i>
    </div>
    
    <div class="chatbot-container" id="chatbot">
        <div class="chatbot-header">
            <h3>Language Learning Assistant</h3>
            <button class="close-chat" id="closeChat"><i class="fas fa-times"></i></button>
        </div>
        <div class="chatbot-messages" id="chatMessages">
            <div class="message bot-message">
                Hello! I'm your language learning assistant. How can I help you practice today?
            </div>
        </div>
        <div class="chatbot-input">
            <input type="text" id="userInput" placeholder="Type your message here...">
            <button id="sendMessage"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-language"></i>
                <h1>ILLC - <span>Interactive Language Learning</span></h1>
            </div>
            <div class="user-actions">
                <span id="userScore">Score: 0</span>
            </div>
        </header>
        
        <div class="content-area" id="contentArea">
            <!-- Content will be dynamically loaded here -->
        </div>
        
        <footer>
            <p>&copy; 2023 ILLC - Interactive Language Learning Chatbot | Developed by PKB | ABC University</p>
        </footer>
    </div>

    <script>
        // Global variables
        let currentScore = 0;
        let userProgress = {};
        let currentFlashcardIndex = 0;
        let currentFlashcards = [];
        let exploredCards = new Set();
        let chatPipe = null;
        let modelLoading = false;

        // Initialize the app
        document.addEventListener('DOMContentLoaded', function() {
            loadProgress();
            updateScoreDisplay();
            loadPage('welcome');
            
            // Home button event
            document.getElementById('homeBtn').addEventListener('click', function() {
                loadPage('home');
            });
            
            // Chat button events
            document.getElementById('chatBtn').addEventListener('click', function() {
                document.getElementById('chatbot').style.display = 'flex';
                initializeChatModel();
            });
            
            document.getElementById('closeChat').addEventListener('click', function() {
                document.getElementById('chatbot').style.display = 'none';
            });
            
            // Send message in chatbot
            document.getElementById('sendMessage').addEventListener('click', sendMessage);
            document.getElementById('userInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
        });

        // Initialize the chat model
        async function initializeChatModel() {
            if (chatPipe || modelLoading) return;
            
            modelLoading = true;
            try {
                addMessage("Loading AI model...", 'bot', true);
                import { pipeline } from '@huggingface/transformers';
                chatPipe = await pipeline('any-to-any', 'onnx-community/Janus-1.3B-ONNX');
                removeLoadingMessage();
                addMessage("AI model loaded! How can I assist you with language learning today?", 'bot');
            } catch (error) {
                console.error('Error loading model:', error);
                removeLoadingMessage();
                addMessage("I'm here to help with your language learning! What would you like to practice today?", 'bot');
            }
            modelLoading = false;
        }

        function removeLoadingMessage() {
            const messages = document.getElementById('chatMessages');
            const lastMessage = messages.lastChild;
            if (lastMessage && lastMessage.classList.contains('loading')) {
                messages.removeChild(lastMessage);
            }
        }

        // Load user progress from localStorage
        function loadProgress() {
            const savedProgress = localStorage.getItem('illcProgress');
            if (savedProgress) {
                userProgress = JSON.parse(savedProgress);
            }
            
            const savedScore = localStorage.getItem('illcScore');
            if (savedScore) {
                currentScore = parseInt(savedScore);
            }
            
            const savedExplored = localStorage.getItem('illcExplored');
            if (savedExplored) {
                exploredCards = new Set(JSON.parse(savedExplored));
            }
        }

        // Save user progress to localStorage
        function saveProgress() {
            localStorage.setItem('illcProgress', JSON.stringify(userProgress));
            localStorage.setItem('illcScore', currentScore.toString());
            localStorage.setItem('illcExplored', JSON.stringify([...exploredCards]));
        }

        // Update score display
        function updateScoreDisplay() {
            document.getElementById('userScore').textContent = `Score: ${currentScore}`;
        }

        // Page navigation
        function loadPage(page) {
            const contentArea = document.getElementById('contentArea');
            
            switch(page) {
                case 'welcome':
                    contentArea.innerHTML = `
                        <div class="welcome-screen" id="welcomeScreen">
                            <h2>Welcome to ILLC</h2>
                            <p>- The Interactive Language Learning Webapp -</p>
                            <p class="developer">Developed by PKB</p>
                            <p>as a Project for MCA course in</p>
                            <p class="university">ABC University</p>
                            <p style="margin-top: 30px; font-size: 0.9rem; color: #888;">Click anywhere to continue</p>
                        </div>
                    `;
                    
                    document.getElementById('welcomeScreen').addEventListener('click', function() {
                        loadPage('home');
                    });
                    break;
                    
                case 'home':
                    contentArea.innerHTML = `
                        <div style="text-align: center; margin-bottom: 30px;">
                            <h2 style="color: #333; margin-bottom: 10px;">Language Learning Dashboard</h2>
                            <p style="color: #666;">Choose an activity to improve your language skills</p>
                        </div>
                        <div class="dashboard">
                            <div class="dashboard-card" id="learnCard">
                                <i class="fas fa-book-open"></i>
                                <h3>Learn</h3>
                                <p>Explore vocabulary with interactive flashcards</p>
                            </div>
                            <div class="dashboard-card" id="practiceCard">
                                <i class="fas fa-comments"></i>
                                <h3>Practice</h3>
                                <p>Test your knowledge with interactive exercises</p>
                            </div>
                            <div class="dashboard-card" id="progressCard">
                                <i class="fas fa-chart-line"></i>
                                <h3>Progress</h3>
                                <p>Track your learning journey and see your improvements</p>
                            </div>
                        </div>
                    `;
                    
                    document.getElementById('learnCard').addEventListener('click', function() {
                        loadPage('learn');
                    });
                    
                    document.getElementById('practiceCard').addEventListener('click', function() {
                        loadPage('practice');
                    });
                    
                    document.getElementById('progressCard').addEventListener('click', function() {
                        loadPage('progress');
                    });
                    break;
                    
                case 'learn':
                    contentArea.innerHTML = `
                        <div class="learn-container">
                            <h2 style="text-align: center; margin-bottom: 20px; color: #333;">Learn Vocabulary</h2>
                            <div class="filters">
                                <div class="filter-group">
                                    <label for="learn-lang1-select">Language 1</label>
                                    <select id="learn-lang1-select">
                                        <option value="">Select Language</option>
                                        <option value="english">English</option>
                                        <option value="spanish">Spanish</option>
                                        <option value="french">French</option>
                                    </select>
                                </div>
                                <div class="filter-group">
                                    <label for="learn-lang2-select">Language 2</label>
                                    <select id="learn-lang2-select">
                                        <option value="">Select Language</option>
                                        <option value="english">English</option>
                                        <option value="spanish">Spanish</option>
                                        <option value="french">French</option>
                                    </select>
                                </div>
                                <div class="filter-group">
                                    <label for="learn-cat-select">Category</label>
                                    <select id="learn-cat-select">
                                        <option value="">Select Category</option>
                                        <option value="Numbers">Numbers</option>
                                        <option value="Places">Places</option>
                                        <option value="People">People</option>
                                        <option value="Items">Items</option>
                                        <option value="Verbs">Verbs</option>
                                    </select>
                                </div>
                            </div>
                            <div class="progress-container">
                                <div class="progress-bar">
                                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                                </div>
                                <div class="progress-text" id="progressText">0/0 cards explored</div>
                            </div>
                            <div class="flashcard-container">
                                <div class="flashcard" id="flashcard">
                                    <div class="flashcard-front">
                                        <div class="flashcard-word" id="flashcardWord">Select filters to begin</div>
                                        <div class="flashcard-pronunciation" id="flashcardPronunciation"></div>
                                        <p style="color: #666; margin-top: 20px;">Click to reveal meaning</p>
                                    </div>
                                    <div class="flashcard-back">
                                        <div class="flashcard-meaning" id="flashcardMeaning">Select filters to load flashcards</div>
                                    </div>
                                </div>
                            </div>
                            <div class="navigation-buttons">
                                <button class="btn" id="prevCard" disabled>Previous</button>
                                <button class="btn" id="nextCard" disabled>Next</button>
                            </div>
                        </div>
                    `;
                    
                    // Add event listeners for learn page
                    const lang1Select = document.getElementById('learn-lang1-select');
                    const lang2Select = document.getElementById('learn-lang2-select');
                    const catSelect = document.getElementById('learn-cat-select');
                    const flashcard = document.getElementById('flashcard');
                    const prevBtn = document.getElementById('prevCard');
                    const nextBtn = document.getElementById('nextCard');
                    
                    [lang1Select, lang2Select, catSelect].forEach(select => {
                        select.addEventListener('change', loadFlashcards);
                    });
                    
                    flashcard.addEventListener('click', function() {
                        flashcard.classList.toggle('flipped');
                        if (flashcard.classList.contains('flipped') && currentFlashcards.length > 0) {
                            const cardId = `${currentFlashcards[currentFlashcardIndex].word}-${currentFlashcards[currentFlashcardIndex].meaning}`;
                            exploredCards.add(cardId);
                            saveProgress();
                            updateProgress();
                        }
                    });
                    
                    prevBtn.addEventListener('click', showPreviousCard);
                    nextBtn.addEventListener('click', showNextCard);
                    break;
                    
                case 'practice':
                    contentArea.innerHTML = `
                        <div class="practice-container">
                            <h2 style="text-align: center; margin-bottom: 20px; color: #333;">Practice Your Skills</h2>
                            <div class="filters">
                                <div class="filter-group">
                                    <label for="practice-lang-select">Language</label>
                                    <select id="practice-lang-select">
                                        <option value="">Select Language</option>
                                        <option value="hindi">hindi</option>
                                        <option value="bengali">bengali</option>
                                        <option value="tamil">tamil</option>
                                        <option value="french">french</option>
                                        <option value="spanish">spanish</option>
                                        <option value="russian">russian</option>
                                    </select>
                                </div>
                                <div class="filter-group">
                                    <label for="practice-cat-select">Category</label>
                                    <select id="practice-cat-select">
                                        <option value="">Select Category</option>
                                        <option value="Numbers">Numbers</option>
                                        <option value="Places">Places</option>
                                        <option value="People">People</option>
                                        <option value="Items">Items</option>
                                        <option value="Verbs">Verbs</option>
                                    </select>
                                </div>
                                <div class="filter-group">
                                    <label for="practice-type-select">Exercise Type</label>
                                    <select id="practice-type-select">
                                        <option value="">Select Type</option>
                                        <option value="1">Word to Meaning (MCQ)</option>
                                        <option value="2">Meaning to Word (MCQ)</option>
                                        <option value="3">Word to Meaning (Text)</option>
                                        <option value="4">Meaning to Word (Text)</option>
                                    </select>
                                </div>
                            </div>
                            <button class="btn" style="width: 100%; margin-bottom: 20px;" onclick="startPractice()">Start Practice</button>
                            <div class="practice-area" id="practice-area">
                                <p style="color: #666; text-align: center;">Select your preferences and click "Start Practice" to begin</p>
                            </div>
                        </div>
                    `;
                    break;
                    
                case 'progress':
                    contentArea.innerHTML = `
                        <div class="page-placeholder">
                            <i class="fas fa-chart-line"></i>
                            <h2>Your Progress</h2>
                            <p>Total Score: <strong>${currentScore}</strong></p>
                            <p>Cards Explored: <strong>${exploredCards.size}</strong></p>
                            <button class="btn" style="margin-top: 30px;" onclick="loadPage('home')">Back to Dashboard</button>
                        </div>
                    `;
                    break;
            }
        }

        // Flashcard functions
        function loadFlashcards() {
            const languages = document.getElementById('learn-languages-select').value;
            const category = document.getElementById('learn-cat-select').value;
            
            if (!languages || !category) {
                return;
            }
            
            // Load data from data.json
            fetch('data.json')
                .then(response => response.json())
                .then(data => {
                    const languageData = data[languages][category] ? data[languages][category] : [];
                    currentFlashcards = languageData.map(item => {
                        const parts = item.split(' ');
                        return {
                            word: parts[0],
                            pronunciation: parts[1],
                            meaning: parts.slice(2).join(' ')
                        };
                    });
                    
                    currentFlashcardIndex = 0;
                    showCurrentCard();
                    updateProgress();
                    
                    // Enable navigation buttons
                    document.getElementById('prevCard').disabled = false;
                    document.getElementById('nextCard').disabled = false;
                })
                .catch(error => {
                    console.error('Error loading flashcards:', error);
                    currentFlashcards = [];
                });
        }

        function showCurrentCard() {
            if (currentFlashcards.length === 0) return;
            
            const card = currentFlashcards[currentFlashcardIndex];
            document.getElementById('flashcardWord').textContent = card.word;
            document.getElementById('flashcardPronunciation').textContent = card.pronunciation;
            document.getElementById('flashcardMeaning').textContent = card.meaning;
            
            // Reset flip state
            document.getElementById('flashcard').classList.remove('flipped');
        }

        function showPreviousCard() {
            if (currentFlashcardIndex > 0) {
                currentFlashcardIndex--;
                showCurrentCard();
            }
        }

        function showNextCard() {
            if (currentFlashcardIndex < currentFlashcards.length - 1) {
                currentFlashcardIndex++;
                showCurrentCard();
            }
        }

        function updateProgress() {
            if (currentFlashcards.length === 0) {
                document.getElementById('progressFill').style.width = '0%';
                document.getElementById('progressText').textContent = '0/0 cards explored';
                return;
            }
            
            const exploredInSet = currentFlashcards.filter(card => 
                exploredCards.has(`${card.word}-${card.meaning}`)
            ).length;
            
            const progressPercent = (exploredInSet / currentFlashcards.length) * 100;
            document.getElementById('progressFill').style.width = `${progressPercent}%`;
            document.getElementById('progressText').textContent = 
                `${exploredInSet}/${currentFlashcards.length} cards explored`;
        }

        // Practice functions
        function startPractice() {
            const language = document.getElementById('practice-lang-select').value;
            const category = document.getElementById('practice-cat-select').value;
            const type = document.getElementById('practice-type-select').value;
            const practiceArea = document.getElementById('practice-area');

            if (!languages || !category || !type) {
                practiceArea.innerHTML = '<p style="color: #721c24;">Please select all options</p>';
                return;
            }

            // Load data from data.json
            fetch('data.json')
                .then(response => response.json())
                .then(data => {
                    const languageData = data[languages][category] ? data[languages][category] : [];
                    
                    if (languageData.length === 0) {
                        practiceArea.innerHTML = '<p style="color: #721c24;">No data available for selected options</p>';
                        return;
                    }

                    const randomIndex = Math.floor(Math.random() * languageData.length);
                    const selectedItem = languageData[randomIndex];
                    const parts = selectedItem.split(' ');
                    const word = parts[0];
                    const pronunciation = parts[1];
                    const correctEnglish = parts.slice(2).join(' ');

                    if (type === '1') {
                        let otherWords = [];
                        while (otherWords.length < 3) {
                            const idx = Math.floor(Math.random() * languageData.length);
                            if (idx !== randomIndex) {
                                const item = languageData[idx];
                                const english = item.split(' ').slice(2).join(' ');
                                if (!otherWords.includes(english)) {
                                    otherWords.push(english);
                                }
                            }
                        }
                        const replaceIndex = Math.floor(Math.random() * 4);
                        const options = [...otherWords];
                        options.splice(replaceIndex, 0, correctEnglish);
                        if (options.length > 4) options.pop();
                        for (let i = options.length - 1; i > 0; i--) {
                            const j = Math.floor(Math.random() * (i + 1));
                            [options[i], options[j]] = [options[j], options[i]];
                        }
                        practiceArea.innerHTML = `
                            <div class="question">${word} (${pronunciation})</div>
                            <div id="options">
                                ${options.map(opt => `<button class="option-button" onclick="checkAnswer('${opt.replace(/'/g, "\\'")}', '${correctEnglish.replace(/'/g, "\\'")}', '1')">${opt}</button>`).join('')}
                            </div>
                            <div id="message" class="message"></div>
                        `;
                    } else if (type === '2') {
                        let otherWords = [];
                        while (otherWords.length < 3) {
                            const idx = Math.floor(Math.random() * languageData.length);
                            if (idx !== randomIndex) {
                                const item = languageData[idx];
                                const targetWord = item.split(' ')[0];
                                if (!otherWords.includes(targetWord)) {
                                    otherWords.push(targetWord);
                                }
                            }
                        }
                        const replaceIndex = Math.floor(Math.random() * 4);
                        const options = [...otherWords];
                        options.splice(replaceIndex, 0, word);
                        if (options.length > 4) options.pop();
                        for (let i = options.length - 1; i > 0; i--) {
                            const j = Math.floor(Math.random() * (i + 1));
                            [options[i], options[j]] = [options[j], options[i]];
                        }
                        practiceArea.innerHTML = `
                            <div class="question">${correctEnglish} (${pronunciation})</div>
                            <div id="options">
                                ${options.map(opt => `<button class="option-button" onclick="checkAnswer('${opt.replace(/'/g, "\\'")}', '${word.replace(/'/g, "\\'")}', '2')">${opt}</button>`).join('')}
                            </div>
                            <div id="message" class="message"></div>
                        `;
                    } else if (type === '3') {
                        practiceArea.innerHTML = `
                            <div class="question">${word} (${pronunciation})</div>
                            <input type="text" id="answer-input" placeholder="Enter English meaning">
                            <button class="btn" onclick="checkTextAnswer(document.getElementById('answer-input').value, '${correctEnglish.replace(/'/g, "\\'")}', '3')">Submit</button>
                            <div id="message" class="message"></div>
                        `;
                    } else if (type === '4') {
                        practiceArea.innerHTML = `
                            <div class="question">${correctEnglish}</div>
                            <input type="text" id="answer-input" placeholder="Enter word or pronunciation">
                            <button class="btn" onclick="checkTextAnswer(document.getElementById('answer-input').value, '${word.replace(/'/g, "\\'")}|${pronunciation.replace(/'/g, "\\'")}', '4')">Submit</button>
                            <div id="message" class="message"></div>
                        `;
                    }
                })
                .catch(error => {
                    console.error('Error loading practice data:', error);
                    practiceArea.innerHTML = '<p style="color: #721c24;">Error loading practice data</p>';
                });
        }

        function checkAnswer(selected, correct, type) {
            const messageDiv = document.getElementById('message');
            if (selected === correct) {
                messageDiv.textContent = 'Correct Answer!';
                messageDiv.className = 'message correct';
                currentScore += 10;
                updateScoreDisplay();
                saveProgress();
            } else {
                messageDiv.textContent = `Incorrect Answer! Correct: ${correct}`;
                messageDiv.className = 'message incorrect';
            }
            messageDiv.style.display = 'block';
            setTimeout(() => {
                messageDiv.style.display = 'none';
                startPractice();
            }, 2000);
        }

        function checkTextAnswer(input, correct, type) {
            const messageDiv = document.getElementById('message');
            let isCorrect = false;
            let correctText = correct;

            if (type === '3') {
                const similarity = getSimilarity(input.toLowerCase(), correct.toLowerCase());
                isCorrect = similarity >= 60;
            } else if (type === '4') {
                const [word, pronunciation] = correct.split('|');
                const simWord = getSimilarity(input.toLowerCase(), word.toLowerCase());
                const simPron = getSimilarity(input.toLowerCase(), pronunciation.toLowerCase());
                isCorrect = Math.max(simWord, simPron) >= 50;
                correctText = word;
            }

            if (isCorrect) {
                messageDiv.textContent = 'Correct Answer!';
                messageDiv.className = 'message correct';
                currentScore += 10;
                updateScoreDisplay();
                saveProgress();
            } else {
                messageDiv.textContent = `Incorrect Answer! Correct: ${correctText}`;
                messageDiv.className = 'message incorrect';
            }
            messageDiv.style.display = 'block';
            setTimeout(() => {
                messageDiv.style.display = 'none';
                const answerInput = document.getElementById('answer-input');
                if (answerInput) answerInput.value = '';
                startPractice();
            }, 2000);
        }

        // Simple similarity function
        function getSimilarity(str1, str2) {
            const longer = str1.length > str2.length ? str1 : str2;
            const shorter = str1.length > str2.length ? str2 : str1;
            
            if (longer.length === 0) return 100;
            
            if (str1 === str2) return 100;
            
            if (longer.includes(shorter)) return 80;
            
            let matches = 0;
            for (let i = 0; i < shorter.length; i++) {
                if (longer.includes(shorter[i])) matches++;
            }
            
            return (matches / longer.length) * 100;
        }

        // Chatbot functions
        async function sendMessage() {
            const userInput = document.getElementById('userInput');
            const message = userInput.value.trim();
            if (message === '') return;

            addMessage(message, 'user');
            userInput.value = '';

            if (chatPipe) {
                addMessage("Thinking...", 'bot', true);
                try {
                    const response = await chatPipe(message, {
                        max_new_tokens: 50,
                        temperature: 0.1
                    });
                    removeLoadingMessage();
                    addMessage(response[0].generated_text, 'bot');
                } catch (error) {
                    console.error('Error generating response:', error);
                    removeLoadingMessage();
                    addMessage("I encountered an error. How can I help you with language learning?", 'bot');
                }
            } else {
                addMessage("I'm still loading. Please try again in a moment.", 'bot');
            }
        }

        function addMessage(text, sender, loading = false) {
            const messagesContainer = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message ${loading ? 'loading' : ''}`;
            messageDiv.textContent = text;
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
    </script>
</body>
